  # ---------------- Windows Artifacts (Extended) ----------------

  - name: "Windows Event Logs – High-Value Operational Channels"
    description: "Task Scheduler, PowerShell, Sysmon, WMI and RDP operational logs"
    paths:
      - path: '(?i)^([A-Z]:)?[\\/]Windows[\\/]System32[\\/]winevt[\\/]Logs[\\/]Microsoft-Windows-TaskScheduler%4Operational\.evtx$'
        regexp: true
      - path: '(?i)^([A-Z]:)?[\\/]Windows[\\/]System32[\\/]winevt[\\/]Logs[\\/]Microsoft-Windows-PowerShell%4Operational\.evtx$'
        regexp: true
      - path: '(?i)^([A-Z]:)?[\\/]Windows[\\/]System32[\\/]winevt[\\/]Logs[\\/]Windows PowerShell\.evtx$'
        regexp: true
      - path: '(?i)^([A-Z]:)?[\\/]Windows[\\/]System32[\\/]winevt[\\/]Logs[\\/]Microsoft-Windows-Sysmon%4Operational\.evtx$'
        regexp: true
      - path: '(?i)^([A-Z]:)?[\\/]Windows[\\/]System32[\\/]winevt[\\/]Logs[\\/]Microsoft-Windows-WMI-Activity%4Operational\.evtx$'
        regexp: true
      - path: '(?i)^([A-Z]:)?[\\/]Windows[\\/]System32[\\/]winevt[\\/]Logs[\\/]Microsoft-Windows-TerminalServices-(LocalSessionManager|RemoteConnectionManager)%4Operational\.evtx$'
